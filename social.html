<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social — ShopWave</title><link rel="stylesheet" href="css/style.css"><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script><script src="js/firebase-config.js"></script></head><body><header class="site-header"><div class="container navbar"><a class="logo" href="index.html">Shop<span>Wave</span></a><nav class="site-nav"><a href="shop.html">Shop</a><a href="business.html">Businesses</a><a href="live.html">Live</a></nav></div></header><main class="section"><div class="container"><div class="eyebrow">Community feed</div><h1>Social</h1><p class="muted">Only real posts created by ShopWave users are shown.</p><div id="postFeed" class="grid"><div class="empty-state">Loading…</div></div></div></main><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{initFirebase();const el=document.querySelector("#postFeed");try{const s=await db.collection("posts").where("status","==","published").orderBy("createdAt","desc").limit(30).get();el.innerHTML=s.size?[...s.docs].map(d=>{const x=d.data();return `<div class="card"><div class="card-body"><span class="badge">Post</span><h3>${esc(x.title||"")}</h3><p>${esc(x.body||"")}</p></div></div>`}).join(""):"<div class=\"empty-state\">No posts have been created yet.</div>"}catch(e){el.innerHTML="<div class=\"empty-state\">No posts are available yet.</div>"}});</script></body></html>
