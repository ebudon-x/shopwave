<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live — ShopWave</title><link rel="stylesheet" href="css/style.css"><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script></head><body><header class="site-header"><div class="container navbar"><a class="logo" href="index.html">Shop<span>Wave</span></a><nav class="site-nav"><a href="shop.html">Shop</a><a href="business.html">Businesses</a><a href="live.html">Live</a></nav><a class="btn btn-primary" href="cart.html">Cart <span class="cart-count">0</span></a></div></header><main class="section"><div class="container"><div class="eyebrow">Real-time community</div><h1>Live sessions</h1><p class="muted">Only live sessions created by real sellers are shown. Video transport is intended for LiveKit WebRTC; no fake viewers or fake streams are generated.</p><div id="liveList" class="grid"><div class="empty-state">Live sessions will appear here when sellers start a real broadcast.</div></div></div></main><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{if(!window.firebaseReady)return;const el=document.querySelector("#liveList");try{const snap=await db.collection("liveSessions").where("status","==","live").limit(20).get();el.innerHTML=snap.size?[...snap.docs].map(d=>{const x=d.data();return `<div class="card"><div class="card-body"><span class="badge"><span class="live-dot"></span>LIVE</span><h3>${esc(x.title||"Live session")}</h3><p class="muted">${esc(x.businessName||"")}</p><a class="btn btn-primary" href="live-room.html?id=${d.id}">Join live</a></div></div>`}).join(""):"<div class=\"empty-state\">No seller is live right now.</div>"}catch(e){el.innerHTML="<div class=\"empty-state\">Live sessions are not available yet.</div>"}});</script></body></html>
