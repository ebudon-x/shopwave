<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Room — ShopWave</title><link rel="stylesheet" href="css/style.css"><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script></head><body><header class="site-header"><div class="container navbar"><a class="logo" href="index.html">Shop<span>Wave</span></a><a class="btn btn-light" href="live.html">Back to Live</a></div></header><main class="section"><div class="container"><div class="panel"><div class="eyebrow">Live room</div><h1 id="liveTitle">Loading…</h1><p id="liveMeta" class="muted"></p><div id="videoArea" style="min-height:360px;display:grid;place-items:center;border:1px solid #dbe4de;border-radius:18px;margin-top:20px">Connect the LiveKit client here after the LiveKit project URL is configured. This page never generates a fake stream.</div></div></div></main><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{initFirebase();const id=new URLSearchParams(location.search).get("id");if(!id||!firebaseReady)return;const d=await db.collection("liveSessions").doc(id).get();if(!d.exists)return;const x=d.data();document.querySelector("#liveTitle").textContent=x.title||"Live session";document.querySelector("#liveMeta").textContent=x.businessName||"ShopWave seller";});</script></body></html>
